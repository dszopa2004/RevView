name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: true

      - name: Apply production UI conditions
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              "!root.obd-initialized && !root.show-settings":
                  "root.obd-initialized && !root.show-settings",
              "if root.obd-initialized: Rectangle":
                  "if !root.obd-initialized: Rectangle",
          }

          path = Path("crates/revview-ui/dashboard.slint")
          contents = path.read_text()

          expected_counts = {
              "!root.obd-initialized && !root.show-settings": 2,
              "if root.obd-initialized: Rectangle": 1,
          }

          actual_counts = {
              old: contents.count(old)
              for old in replacements
          }

          if actual_counts != expected_counts:
              raise SystemExit(
                  f"Expected conditions {expected_counts}; "
                  f"found {actual_counts}"
              )

          for old, new in replacements.items():
              contents = contents.replace(old, new)

          path.write_text(contents)

          print("Successfully applied production UI conditions.")
          PY

      - name: Build release
        run: cargo build --workspace --release --locked
